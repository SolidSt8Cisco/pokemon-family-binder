<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18212f"><title>Pokémon Family Binder</title>
<style>
.tile-wrap{position:relative;aspect-ratio:2.5/3.5;min-width:0}
.tile-wrap .binder-tile{width:100%;height:100%}
.slot img.card-img{-webkit-tap-highlight-color:transparent}
.icon-row{gap:8px;align-items:center}
.icon-row-btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;line-height:1;padding:8px 12px}
.icon-row-btn svg{display:block}
.tile-wrap .tile-delete{position:absolute;top:5px;right:5px;z-index:2;padding:5px 8px;background:#111c2ddd;border-color:#718198;color:var(--text)}
.tile-wrap .tile-delete:hover{background:var(--danger);border-color:var(--danger)}
.save-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4caf6a;opacity:.75;transition:background .2s,opacity .2s;flex:none}
.save-dot.saving{background:var(--accent);opacity:1;animation:pulse 1s ease-in-out infinite}
.save-dot.error{background:var(--danger);opacity:1}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.result{position:relative}
.result-badge{position:absolute;top:4px;left:4px;background:var(--accent);color:#101722;font-size:.66rem;font-weight:700;padding:2px 6px;border-radius:999px;line-height:1.2;pointer-events:none}
.result-badge.wanted{left:auto;right:4px;background:#6ea8ff}
:root{color-scheme:dark;--bg:#101722;--panel:#1a2534;--line:#35465c;--text:#f3f6fb;--muted:#b6c2d2;--accent:#ffd34e;--danger:#a74355}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}h1{font-size:1.2rem;margin:0}h2{font-size:1.15rem;margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#26364a;color:var(--text);padding:10px 13px}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.wrap{max-width:1050px;margin:auto;padding:18px 14px 42px}.sub{color:var(--muted);font-size:.92rem;margin:4px 0 18px}.note{color:var(--muted);font-size:.82rem}.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:15px;margin-bottom:16px}.field{width:100%;min-width:0;background:#101722;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.hidden{display:none!important}.status{color:var(--muted);min-height:1.5em;font-size:.9rem}.library-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.binder-tile{padding:0;aspect-ratio:2.5/3.5;min-width:0;position:relative;overflow:hidden;border-radius:13px;border:1px solid var(--line);background:#1d2a3b;display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;text-align:left}.binder-tile img{width:100%;height:100%;position:absolute;inset:0;object-fit:fill}.binder-tile .cover-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.1rem;color:var(--accent);background:linear-gradient(145deg,#293b52,#141d2a)}.binder-tile .tile-footer{position:absolute;left:0;right:0;bottom:0;background:#080d16db;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;z-index:1}.binder-tile .tile-count{font-size:.72rem;color:var(--muted);line-height:1.2}.binder-tile .tile-name{font-weight:650;font-size:.9rem;color:var(--text);line-height:1.2;text-align:center;overflow-wrap:anywhere}.binder-tile.add-tile{align-items:center;justify-content:center;border-style:dashed;background:transparent;text-align:center}.plus{font-size:3.5rem;color:var(--accent);line-height:1}.add-label{font-size:.9rem;color:var(--muted)}.pagebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}.pagebar .group{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.slot{position:relative;aspect-ratio:2.5/3.5;min-width:0;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#202d3e,#151e2b);overflow:hidden;display:flex;align-items:center;justify-content:center}.slot.empty{border-style:dashed}.slot img.card-img{width:100%;height:100%;object-fit:contain;background:#111a26}.cardtools{position:absolute;top:5px;right:5px;display:flex;gap:4px}.cardtools button{padding:5px 8px;background:#111c2ddd;border-color:#718198}
.slotlabel{position:absolute;bottom:0;left:0;right:0;padding:4px 5px;background:transparent;color:var(--text);font-size:.72rem;text-align:center;overflow-wrap:anywhere;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none;opacity:.85}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.modal{position:fixed;inset:0;background:#05080dcc;z-index:10;display:none;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);max-height:92dvh;overflow:auto;padding:16px}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px}.searchrow{display:flex;gap:8px;margin:14px 0}.searchrow input{min-width:0;flex:1}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.result{border:1px solid var(--line);background:#111b28;border-radius:10px;padding:7px;text-align:left;min-width:0}.result img{display:block;width:100%;aspect-ratio:2.5/3.5;object-fit:contain}.result strong{display:block;font-size:.85rem;margin-top:6px}.result small{display:block;color:var(--muted);font-size:.75rem}.close{font-size:1.25rem;padding:5px 11px}.cover-preview{width:88px;aspect-ratio:2.5/3.5;height:auto;object-fit:fill;border:1px solid var(--line);border-radius:10px;background:#101722}
.primary{background:var(--accent);color:#101722;border-color:var(--accent);font-weight:700;width:100%;padding:14px}.danger{background:#472b34;border-color:#79424f}.danger:hover{background:#5a3441}.list{display:grid;gap:8px;margin-top:10px}.item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#111b28;border-radius:10px;padding:6px;color:var(--text);text-align:left;cursor:pointer;font:inherit}.item:hover{background:#16222f}.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.item img{width:44px;aspect-ratio:2.5/3.5;object-fit:contain;flex:none}.item .meta{min-width:0}.item strong{display:block;overflow-wrap:anywhere}.item small{color:var(--muted)}.badge{margin-left:auto;background:var(--accent);color:#101722;border-radius:999px;padding:2px 9px;font-weight:700;font-size:.8rem;flex:none}
.owner-chip{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#111b28;color:var(--text);cursor:pointer;font:inherit;font-size:.9rem}
.owner-chip.active{background:var(--accent);color:#101722;border-color:var(--accent);font-weight:700}
.cart-group{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.cart-group-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.cart-group-head strong{font-size:1rem}
.cart-group-head .owner-sub{color:var(--muted);font-size:.82rem}
.cart-group-head .owner-flag{font-weight:700;font-size:.85rem}
.cart-group-head .owner-flag.over{color:#ff8a8a}
.cart-group-head .owner-flag.under{color:#7ddf9b}
.cart-group-head .owner-flag.even{color:var(--muted)}
.cart-group-body{padding:0 10px 10px}
.cart-row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#111b28;border-radius:10px;padding:8px;margin-top:8px;flex-wrap:wrap}
.cart-row img{width:44px;aspect-ratio:2.5/3.5;object-fit:contain;flex:none}
.cart-row .meta{flex:1;min-width:120px}
.cart-row strong{display:block;overflow-wrap:anywhere;font-size:.92rem}
.cart-row small{color:var(--muted);display:block;font-size:.78rem}
.cart-row .price-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.cart-row .price-box label{font-size:.75rem;color:var(--muted)}
.cart-row .price-box input{width:80px;padding:5px 7px;font-size:.85rem;background:#101722;border:1px solid var(--line);border-radius:8px;color:var(--text)}
.cart-row .price-box .online{font-size:.82rem;color:var(--muted)}
.cart-row .price-box .delta{font-size:.82rem;font-weight:700}
.cart-row .price-box .delta.over{color:#ff8a8a}
.cart-row .price-box .delta.under{color:#7ddf9b}
.cart-row .price-box .delta.even{color:var(--muted)}
.cart-row .del{padding:4px 8px;background:#111c2ddd;border-color:#718198;font-size:.9rem;margin-left:auto}
.cart-empty{color:var(--muted);padding:10px 4px;font-size:.88rem}
.cart-totals{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.9rem}
.cart-totals .total-block{background:#111b28;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.cart-totals .total-block strong{display:block;color:var(--accent);font-size:1rem}
@media(min-width:620px){.library-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid{gap:14px}.wrap{padding-top:24px}.slot{max-height:420px}.results{grid-template-columns:repeat(4,minmax(0,1fr))}.list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:900px){.library-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:380px){.grid{gap:6px}.wrap{padding-left:8px;padding-right:8px}.slotlabel{font-size:.63rem}.tile-name{font-size:.85rem}}
</style></head>
<body>
<main class="wrap">
<section id="authPanel" class="panel"><h2>Sign in to your family binders</h2><p class="sub">Use the same family account on your PC and phone. After sign-in, you'll see all your binders.</p><form id="authForm" class="row"><input id="email" class="field grow" type="email" placeholder="Family account email" autocomplete="username" required><input id="password" class="field grow" type="password" placeholder="Password" autocomplete="current-password" required><button id="signInBtn" type="submit">Sign in</button></form><p id="authStatus" class="status" aria-live="polite">Your family binder library will appear here after sign-in.</p></section>
<section id="libraryView" class="hidden">
<div class="panel"><input id="collQuery" class="field" type="search" placeholder="Search all my cards…" autocomplete="off"><p id="collCount" class="status" aria-live="polite"></p><div id="collList" class="list"></div></div>
<div class="panel hidden" id="backfillPanel"><p class="sub" style="margin:0 0 8px" id="backfillMsg"></p><button id="backfillBtn" type="button" class="primary" style="width:auto;padding:10px 16px">Fill missing card details</button><p id="backfillStatus" class="status" aria-live="polite" style="margin-top:8px"></p></div>
<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="row" style="gap:10px"><button id="cartOpenBtn" type="button">🛒 Shopping cart <span id="cartCountBadge" class="badge" style="margin-left:6px">0</span></button></div></div>
<div id="libraryGrid" class="library-grid"></div><p id="libraryStatus" class="status" aria-live="polite"></p></section>
<section id="cartView" class="hidden">
<div class="row" style="justify-content:space-between;margin-bottom:12px"><button id="cartBackBtn" type="button" class="icon-row-btn">← Back</button><button id="cartClearBtn" type="button" class="danger" style="margin-left:auto">Clear cart</button></div>
<h2>Shopping cart</h2>
<p class="sub" id="cartSummary">0 items</p>
<div class="cart-totals" id="cartTotals"></div>
<div class="panel" style="margin-top:12px">
  <p class="sub" style="margin:0 0 8px">Who is this card for?</p>
  <div class="row" id="cartOwnerChips" style="margin-bottom:12px"></div>
  <form id="cartSearchForm" class="searchrow" style="margin:0"><input id="cartQuery" class="field" type="search" placeholder="Search by Pokémon or card name…" autocomplete="off"><button type="submit">Search</button></form>
  <p id="cartSearchStatus" class="status" aria-live="polite"></p>
  <div id="cartSearchResults" class="results"></div>
</div>
<div id="cartGroups"></div>
<p id="cartStatus" class="status" aria-live="polite"></p>
</section>
<section id="binderView" class="hidden"><div class="row" style="justify-content:space-between;margin-bottom:12px"><button id="backBtn" type="button" class="icon-row-btn">← All binders</button><div class="row icon-row"><button id="renameBtn" type="button" class="icon-row-btn" aria-label="Rename" title="Rename"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button><button id="coverBtn" type="button" class="icon-row-btn" aria-label="Change picture" title="Change picture"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button><input id="coverFile" type="file" accept="image/*" class="hidden"></div></div><div class="row" style="gap:12px;align-items:center"><img id="activeCover" class="cover-preview hidden" alt="Binder cover"><div class="grow"><div class="row" style="gap:8px;align-items:center"><h2 id="activeBinderName">Binder</h2><span id="saveDot" class="save-dot" aria-label="Save status" title="Saved"></span></div></div></div>
<div class="panel" style="margin-top:12px"><form id="inlineSearchForm" class="searchrow" style="margin:0"><input id="inlineQuery" class="field" type="search" placeholder="Search by Pokémon or card name…" autocomplete="off"><button type="submit">Search</button></form><p id="inlineSearchStatus" class="status" aria-live="polite"></p><div id="inlineResults" class="results"></div></div>
<div class="pagebar"><div class="group"><button id="prevPageBtn" type="button">← Previous</button><button id="nextPageBtn" type="button">Next →</button></div><strong id="pageLabel">Page 1 of 1</strong></div><section class="grid" id="cardGrid" aria-label="Nine card binder slots"></section><p id="binderStatus" class="status" aria-live="polite"></p></section>
<div class="row" style="justify-content:center;gap:10px;margin-top:32px;padding-top:16px;border-top:1px solid var(--line)"><button id="exportBtn" type="button">Export backup</button><button id="importBtn" type="button">Import backup</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"><button id="signOutBtn" type="button" class="hidden">Sign out</button></div>
</main>
<div class="modal" id="cardModal" role="dialog" aria-modal="true" aria-labelledby="cardModalTitle"><div class="dialog" style="width:min(520px,100%);text-align:center"><div class="dialoghead"><h2 id="cardModalTitle">Card</h2><button class="close" id="closeCardBtn" aria-label="Close">×</button></div><img id="cardModalImg" alt="" style="width:100%;max-height:70dvh;object-fit:contain;border-radius:10px;background:#111a26;margin-top:12px"><p id="cardModalMeta" class="note" style="margin-top:10px"></p></div></div>
<div class="modal" id="nameModal" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle"><div class="dialog" style="width:min(440px,100%)"><div class="dialoghead"><h2 id="nameModalTitle">Binder name</h2><button class="close" id="closeNameBtn" aria-label="Close">×</button></div><form id="nameForm" style="margin-top:12px"><input id="nameInput" class="field" type="text" maxlength="80" autocomplete="off" required><p id="nameError" class="status" style="color:#ff9b9b" aria-live="polite"></p><div class="row" style="justify-content:flex-end;margin-top:8px"><button type="button" id="nameCancelBtn">Cancel</button><button type="submit" id="nameSaveBtn" class="primary" style="width:auto;padding:10px 18px">Save</button></div></form></div></div>
<div class="modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle"><div class="dialog" style="width:min(440px,100%)"><div class="dialoghead"><h2 id="deleteModalTitle">Delete binder</h2><button class="close" id="closeDeleteBtn" aria-label="Close">×</button></div><p id="deleteModalText" class="sub" style="margin-top:12px"></p><p id="deleteError" class="status" style="color:#ff9b9b" aria-live="polite"></p><div class="row" style="justify-content:flex-end;margin-top:8px"><button type="button" id="deleteCancelBtn">Cancel</button><button type="button" id="deleteConfirmBtn" class="danger">Delete binder</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://whbuikfheckjebgeglpu.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_r5qzENvZgLryyZK_QKSwbQ_C19GIhj_';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let signedInUser=null, binders=[], activeBinderId=null, activePageIndex=0, lastFocus=null, cloudBusy=false, saveTimers={}, pendingSave=false;
let lastDeleted=null;
let nameModalMode=null;
let pendingDeleteId=null;
const CART_OWNERS=['Dad','Kid 1','Kid 2'];
let cartOwner='Dad';
let cartItems=[];
const blankCards=()=>Array(9).fill(null);
function setStatus(id,msg){$(id).textContent=msg}
function currentBinder(){return binders.find(b=>b.id===activeBinderId)||null}
function currentPage(){const b=currentBinder();return b?b.pages[activePageIndex]||null:null}
function normalizePageNumber(n){const x=Number(n);return Number.isInteger(x)&&x>=1?x:1}
function updateAuthUi(){const logged=!!signedInUser;$('authPanel').classList.toggle('hidden',logged);$('signOutBtn').classList.toggle('hidden',!logged);if(!logged){$('libraryView').classList.add('hidden');$('binderView').classList.add('hidden');$('cartView').classList.add('hidden');$('backfillPanel').classList.add('hidden')}}
function showLibrary(){activeBinderId=null;$('binderView').classList.add('hidden');$('cartView').classList.add('hidden');$('libraryView').classList.remove('hidden');renderLibrary();renderCollection();refreshBackfillPanel();refreshCartBadge()}
function showBinder(id){activeBinderId=id;activePageIndex=0;$('libraryView').classList.add('hidden');$('cartView').classList.add('hidden');$('binderView').classList.remove('hidden');renderBinder()}
function showCart(){$('libraryView').classList.add('hidden');$('binderView').classList.add('hidden');$('cartView').classList.remove('hidden');renderCart()}

/* ---------- Collection list ---------- */
function renderCollection(){
const q=$('collQuery').value.trim().toLowerCase(),all=[];
for(const b of binders)for(const p of b.pages)p.cards.forEach((c,i)=>{if(c)all.push({card:c,binder:b.name,page:p.pageNumber,slot:i+1})});
const owned={};all.forEach(x=>{owned[x.card.id]=(owned[x.card.id]||0)+1});
const list=$('collList');list.innerHTML='';
if(!q){
  setStatus('collCount',`${all.length} card${all.length===1?'':'s'} in your collection. Start typing to search.`);
  return;
}
all.sort((a,b)=>a.card.name.localeCompare(b.card.name,undefined,{sensitivity:'base'})||String(a.card.id).localeCompare(String(b.card.id)));
const shown=all.filter(x=>x.card.name.toLowerCase().includes(q)||String(x.card.id).toLowerCase().includes(q));
setStatus('collCount',`${shown.length} match${shown.length===1?'':'es'} for "${$('collQuery').value.trim()}" (${all.length} cards total)`);
for(const x of shown){
    const row=document.createElement('button');row.type='button';row.className='item';
    row.setAttribute('aria-label','View '+x.card.name);
    const img=document.createElement('img');img.loading='lazy';img.alt='';img.src=x.card.image.replace('/high.','/low.');
    const meta=document.createElement('div');meta.className='meta';
    const n=document.createElement('strong');n.textContent=x.card.name;
    const s=document.createElement('small');s.textContent=`${x.card.id} · ${x.binder}, page ${x.page}`;
    meta.append(n,s);row.append(img,meta);
    if(owned[x.card.id]>1){const bd=document.createElement('span');bd.className='badge';bd.textContent='×'+owned[x.card.id];row.append(bd)}
    row.onclick=()=>openCardModal(x.card);
    list.append(row)}
}
$('collQuery').addEventListener('input',renderCollection);

/* ---------- Card lightbox ---------- */
function openCardModal(card){
  lastFocus=document.activeElement;
  $('cardModalTitle').textContent=card.name;
  const big=$('cardModalImg');
  big.onerror=()=>{
    if(!big.dataset.fallback){
      big.dataset.fallback='1';
      big.src=card.image.replace('/high.','/low.');
    } else {
      big.style.display='none';
    }
  };
  big.style.display='';
  big.src=card.image;
  big.alt=card.name;
  $('cardModalMeta').textContent=[card.id,card.setName,card.localId?'#'+card.localId:''].filter(Boolean).join(' · ');
  $('cardModal').classList.add('open');
  $('closeCardBtn').focus();
}
function closeCardModal(){
  $('cardModal').classList.remove('open');
  $('cardModalImg').src='';
  delete $('cardModalImg').dataset.fallback;
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
$('closeCardBtn').onclick=closeCardModal;
$('cardModal').addEventListener('click',e=>{if(e.target===$('cardModal'))closeCardModal()});

/* ---------- Name modal (shared: create + rename) ---------- */
function openNameModal(mode,initial){
  nameModalMode=mode;
  $('nameModalTitle').textContent=mode==='create'?'Name this binder':'Rename binder';
  $('nameInput').value=initial||'';
  $('nameError').textContent='';
  $('nameModal').classList.add('open');
  lastFocus=document.activeElement;
  setTimeout(()=>{$('nameInput').focus();$('nameInput').select()},0);
}
function closeNameModal(){
  $('nameModal').classList.remove('open');
  $('nameInput').value='';
  $('nameError').textContent='';
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
$('closeNameBtn').onclick=closeNameModal;
$('nameCancelBtn').onclick=closeNameModal;
$('nameModal').addEventListener('click',e=>{if(e.target===$('nameModal'))closeNameModal()});
$('nameForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const clean=$('nameInput').value.trim();
  if(!clean){$('nameError').textContent='Please enter a binder name.';return}
  $('nameSaveBtn').disabled=true;
  try{
    if(nameModalMode==='create')await createBinder(clean);
    else if(nameModalMode==='rename')await renameBinder(clean);
    closeNameModal();
  }catch(err){
    $('nameError').textContent=err.message||'Something went wrong.';
  }finally{
    $('nameSaveBtn').disabled=false;
  }
});

/* ---------- Delete modal ---------- */
function openDeleteModal(binderId){
  const b=binders.find(x=>x.id===binderId);
  if(!b)return;
  pendingDeleteId=binderId;
  const count=b.pages.reduce((n,p)=>n+p.cards.filter(Boolean).length,0);
  $('deleteModalText').textContent='Delete "'+b.name+'" and all '+count+' card'+(count===1?'':'s')+' in it? This cannot be undone.';
  $('deleteError').textContent='';
  $('deleteModal').classList.add('open');
  lastFocus=document.activeElement;
  $('deleteCancelBtn').focus();
}
function closeDeleteModal(){
  $('deleteModal').classList.remove('open');
  $('deleteError').textContent='';
  pendingDeleteId=null;
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
$('closeDeleteBtn').onclick=closeDeleteModal;
$('deleteCancelBtn').onclick=closeDeleteModal;
$('deleteModal').addEventListener('click',e=>{if(e.target===$('deleteModal'))closeDeleteModal()});
$('deleteConfirmBtn').onclick=async()=>{
  if(!pendingDeleteId)return;
  const id=pendingDeleteId;
  const b=binders.find(x=>x.id===id);
  if(!b){closeDeleteModal();return}
  $('deleteConfirmBtn').disabled=true;
  $('deleteError').textContent='';
  try{
    await deleteBinder(id);
    closeDeleteModal();
  }catch(err){
    console.error(err);
    $('deleteError').textContent='Delete failed: '+(err.message||'unknown error');
  }finally{
    $('deleteConfirmBtn').disabled=false;
  }
};

async function deleteBinder(binderId){
  if(!signedInUser)throw new Error('You are not signed in.');
  const b=binders.find(x=>x.id===binderId);
  if(!b)throw new Error('Binder not found.');
  const {error:cardErr}=await supabaseClient.from('family_binder_cards').delete().eq('family_id',signedInUser.id).eq('binder_id',binderId);
  if(cardErr)throw new Error('Could not delete cards: '+cardErr.message);
  const {error:pageErr}=await supabaseClient.from('family_binder_pages').delete().eq('family_id',signedInUser.id).eq('binder_id',binderId);
  if(pageErr)throw new Error('Could not delete pages: '+pageErr.message);
  const {error:bErr}=await supabaseClient.from('family_binders').delete().eq('id',binderId).eq('family_id',signedInUser.id);
  if(bErr)throw new Error('Could not delete binder: '+bErr.message);
  if(b.cover_image&&b.cover_image.includes('/storage/v1/object/public/Pokemon/')){
    const marker='/storage/v1/object/public/Pokemon/';
    const idx=b.cover_image.indexOf(marker);
    if(idx!==-1){
      const path=decodeURIComponent(b.cover_image.slice(idx+marker.length));
      if(path)try{await supabaseClient.storage.from('Pokemon').remove([path])}catch(e){console.warn('Cover cleanup skipped:',e)}
    }
  }
  binders=binders.filter(x=>x.id!==binderId);
  if(activeBinderId===binderId)activeBinderId=null;
  renderLibrary();renderCollection();
}

async function loadLibrary(){if(!signedInUser)return;setStatus('authStatus','Loading your family binders from the cloud…');try{const [{data:rows,error:e1},{data:pageRows,error:e2},{data:cardRows,error:e3}]=await Promise.all([supabaseClient.from('family_binders').select('id,family_id,name,cover_image,is_default,sort_order,created_at').eq('family_id',signedInUser.id).order('sort_order').order('created_at'),supabaseClient.from('family_binder_pages').select('binder_id,page_number').eq('family_id',signedInUser.id).order('page_number'),supabaseClient.from('family_binder_cards').select('binder_id,page_number,slot_number,card_id,card_name,image_url,set_name,local_id').eq('family_id',signedInUser.id).order('page_number').order('slot_number')]);if(e1)throw e1;if(e2)throw e2;if(e3)throw e3;binders=(rows||[]).map(r=>({...r,pages:[]}));for(const b of binders){const pageNums=new Set([1]);for(const p of pageRows||[])if(p.binder_id===b.id)pageNums.add(normalizePageNumber(p.page_number));for(const c of cardRows||[])if(c.binder_id===b.id)pageNums.add(normalizePageNumber(c.page_number));b.pages=Array.from(pageNums).sort((a,b)=>a-b).map(pageNumber=>({pageNumber,cards:blankCards()}));for(const c of cardRows||[]){if(c.binder_id!==b.id)continue;const p=b.pages.find(x=>x.pageNumber===c.page_number);if(p&&c.slot_number>=1&&c.slot_number<=9)p.cards[c.slot_number-1]={id:c.card_id,name:c.card_name,image:c.image_url,setName:c.set_name||'',localId:c.local_id||''}}}await loadCart();updateAuthUi();showLibrary();setStatus('authStatus','Signed in. Your family binders are ready.')}catch(e){console.error(e);setStatus('authStatus','Could not load binders: '+(e.message||'check that the new database setup has completed.'));}}
async function createBinder(clean){

$('renameBtn').onclick=()=>{const b=currentBinder();if(!b)return;openNameModal('rename',b.name)};

async function uploadCoverImage(file){
  const fileExt=file.name.split('.').pop();
  const fileName=`${Date.now()}-${Math.random().toString(36).slice(2)}.${fileExt}`;
  const filePath=`public/${fileName}`;
  const {error}=await supabaseClient.storage.from('Pokemon').upload(filePath,file);
  if(error){console.error('Upload error:',error);throw new Error('Could not upload image.')}
  const {data:urlData}=supabaseClient.storage.from('Pokemon').getPublicUrl(filePath);
  return urlData.publicUrl;
}

function saveBinderSoon(message){const b=currentBinder();if(!b)return;if(message)setStatus('binderStatus',message);pendingSave=true;setSaveDot('saving');clearTimeout(saveTimers[b.id]);saveTimers[b.id]=setTimeout(()=>pushBinder(b.id),650)}
async function pushBinder(binderId){if(!signedInUser)return;const b=binders.find(x=>x.id===binderId);if(!b)return;if(cloudBusy){saveTimers[binderId]=setTimeout(()=>pushBinder(binderId),500);return}cloudBusy=true;setSaveDot('saving');try{const pageRows=b.pages.map(p=>({family_id:signedInUser.id,binder_id:b.id,page_number:p.pageNumber}));if(pageRows.length){const {error}=await supabaseClient.from('family_binder_pages').upsert(pageRows,{onConflict:'family_id,binder_id,page_number'});if(error)throw error}const desired=[];for(const p of b.pages)p.cards.forEach((card,i)=>{if(card)desired.push({family_id:signedInUser.id,binder_id:b.id,page_number:p.pageNumber,slot_number:i+1,card_id:String(card.id||''),card_name:card.name,image_url:card.image,set_name:card.setName||null,local_id:card.localId||null})});if(desired.length){const {error}=await supabaseClient.from('family_binder_cards').upsert(desired,{onConflict:'family_id,binder_id,page_number,slot_number'});if(error)throw error}const {data:existing,error:readError}=await supabaseClient.from('family_binder_cards').select('page_number,slot_number').eq('family_id',signedInUser.id).eq('binder_id',b.id);if(readError)throw readError;const wanted=new Set(desired.map(r=>r.page_number+':'+r.slot_number));for(const row of existing||[])if(!wanted.has(row.page_number+':'+row.slot_number)){const {error}=await supabaseClient.from('family_binder_cards').delete().eq('family_id',signedInUser.id).eq('binder_id',b.id).eq('page_number',row.page_number).eq('slot_number',row.slot_number);if(error)throw error}const {data:existingPages,error:pageReadError}=await supabaseClient.from('family_binder_pages').select('page_number').eq('family_id',signedInUser.id).eq('binder_id',b.id);if(pageReadError)throw pageReadError;const wantedPages=new Set(b.pages.map(p=>p.pageNumber));for(const row of existingPages||[])if(!wantedPages.has(row.page_number)){const {error}=await supabaseClient.from('family_binder_pages').delete().eq('family_id',signedInUser.id).eq('binder_id',b.id).eq('page_number',row.page_number);if(error)throw error}}catch(e){console.error(e);setSaveDot('error');setStatus('binderStatus','Cloud save failed: '+(e.message||'check database permissions and RLS policies'))}finally{cloudBusy=false;pendingSave=false;if(!$('saveDot').classList.contains('error'))setSaveDot('saved')}}

/* ---------- Unsaved-changes guard ---------- */
async function flushPendingSave(){
  const ids=Object.keys(saveTimers);
  for(const id of ids){clearTimeout(saveTimers[id]);delete saveTimers[id]}
  if(pendingSave){
    const b=currentBinder();
    if(b){try{await pushBinder(b.id)}catch(e){console.warn('Flush failed:',e)}}
  }
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&pendingSave)flushPendingSave()});
window.addEventListener('pagehide',()=>{if(pendingSave)flushPendingSave()});
window.addEventListener('beforeunload',(e)=>{if(pendingSave){e.preventDefault();e.returnValue='';return ''}});

/* ---------- Backfill missing metadata ---------- */
async function countMissingMetadata(){
  if(!signedInUser)return 0;
  const {count,error}=await supabaseClient.from('family_binder_cards')
    .select('card_id',{count:'exact',head:true})
    .eq('family_id',signedInUser.id)
    .or('set_name.is.null,local_id.is.null');
  if(error){console.warn('Count failed:',error);return 0}
  return count||0;
}
async function refreshBackfillPanel(){
  if(!signedInUser){$('backfillPanel').classList.add('hidden');return}
  const n=await countMissingMetadata();
  if(n>0){
    $('backfillPanel').classList.remove('hidden');
    $('backfillMsg').textContent=n+' card'+(n===1?'':'s')+' missing set and card-number details.';
  } else {
    $('backfillPanel').classList.add('hidden');
    setStatus('backfillStatus','');
  }
}
$('backfillBtn').onclick=async()=>{
  if(!signedInUser)return;
  const btn=$('backfillBtn');
  btn.disabled=true;
  try{
    const {data:rows,error}=await supabaseClient.from('family_binder_cards')
      .select('family_id,binder_id,page_number,slot_number,card_id,set_name,local_id')
      .eq('family_id',signedInUser.id)
      .or('set_name.is.null,local_id.is.null');
    if(error)throw error;
    const total=rows.length;
    if(!total){setStatus('backfillStatus','Nothing to fill.');btn.disabled=false;return}
    let done=0,failed=0;
    for(const row of rows){
      setStatus('backfillStatus',`Filling ${done+1}/${total}…`);
      try{
        const r=await fetch('https://api.tcgdex.net/v2/en/cards/'+encodeURIComponent(row.card_id));
        if(!r.ok){failed++;continue}
        const full=await r.json();
        const setName=full.set?.name||null;
        const localId=full.localId?String(full.localId):null;
        if(!setName&&!localId){failed++;continue}
        const {error:upErr}=await supabaseClient.from('family_binder_cards')
          .update({set_name:setName,local_id:localId})
          .eq('family_id',signedInUser.id)
          .eq('binder_id',row.binder_id)
          .eq('page_number',row.page_number)
          .eq('slot_number',row.slot_number);
        if(upErr){failed++;continue}
        done++;
        const b=binders.find(x=>x.id===row.binder_id);
        if(b){
          const pg=b.pages.find(p=>p.pageNumber===row.page_number);
          if(pg&&row.slot_number>=1&&row.slot_number<=9){
            const card=pg.cards[row.slot_number-1];
            if(card){card.setName=setName||'';card.localId=localId||''}
          }
        }
      }catch(e){failed++;console.warn('Backfill failed for',row.card_id,e)}
    }
    setStatus('backfillStatus',`Done. Filled ${done} card${done===1?'':'s'}${failed?', '+failed+' failed':''}.`);
    renderBinder();
    setTimeout(refreshBackfillPanel,1500);
  }catch(err){
    console.error(err);
    setStatus('backfillStatus','Backfill failed: '+(err.message||'unknown error'));
  }finally{
    btn.disabled=false;
  }
};

/* ---------- Shopping cart ---------- */
async function loadCart(){
  if(!signedInUser)return;
  const {data,error}=await supabaseClient.from('family_shopping_cart')
    .select('id,family_id,card_id,card_name,image_url,set_name,local_id,shelf_price,online_price,price_currency,price_updated,owner,added_at')
    .eq('family_id',signedInUser.id)
    .order('added_at',{ascending:true});
  if(error){console.warn('Cart load failed:',error);cartItems=[];return}
  cartItems=data||[];
}
function refreshCartBadge(){
  const total=cartItems.length;
  $('cartCountBadge').textContent=String(total);
}
function renderOwnerChips(){
  const wrap=$('cartOwnerChips');wrap.innerHTML='';
  for(const owner of CART_OWNERS){
    const b=document.createElement('button');
    b.type='button';
    b.className='owner-chip'+(owner===cartOwner?' active':'');
    b.textContent=owner;
    b.onclick=()=>{cartOwner=owner;renderOwnerChips()};
    wrap.append(b);
  }
}
function extractPrice(full){
  const tp=full.pricing?.tcgplayer;
  if(!tp)return null;
  const variants=['normal','holofoil','reverse-holofoil','1st-edition','unlimited'];
  let value=null;
  for(const v of variants){
    const block=tp[v];
    if(!block)continue;
    const p=block.marketPrice??block.midPrice??block.lowPrice;
    if(p!=null&&p>0){value=p;break}
  }
  if(value==null)return null;
  let updated=null;
  const raw=tp.updated;
  if(raw){
    if(typeof raw==='number'){
      const d=new Date(raw*1000);
      if(!isNaN(d.getTime()))updated=d.toISOString();
    } else {
      const d=new Date(raw);
      if(!isNaN(d.getTime()))updated=d.toISOString();
    }
  }
  return {value,currency:'USD',updated};
}
function fmtUSD(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v)}
function renderCart(){
  refreshCartBadge();
  renderOwnerChips();
  const total=cartItems.length;
  $('cartSummary').textContent=total===0?'Cart is empty.':`${total} item${total===1?'':'s'} in the cart.`;
  /* Totals */
  const totalsWrap=$('cartTotals');totalsWrap.innerHTML='';
  if(total>0){
    const shelfTotal=cartItems.reduce((s,x)=>s+(x.shelf_price!=null?Number(x.shelf_price):0),0);
    const onlineTotal=cartItems.reduce((s,x)=>s+(x.online_price!=null?Number(x.online_price):0),0);
    const haveBoth=cartItems.filter(x=>x.shelf_price!=null&&x.online_price!=null);
    const delta=haveBoth.reduce((s,x)=>s+(Number(x.shelf_price)-Number(x.online_price)),0);
    const mk=(label,val,cls)=>{const d=document.createElement('div');d.className='total-block';const l=document.createElement('div');l.className='owner-sub';l.textContent=label;const v=document.createElement('strong');v.textContent=val;if(cls)v.style.color=cls;d.append(l,v);return d};
    totalsWrap.append(mk('Shelf total',fmtUSD(shelfTotal)));
    totalsWrap.append(mk('Online total',fmtUSD(onlineTotal)));
    if(haveBoth.length){
      const cls=delta>0.005?'#ff8a8a':delta<-0.005?'#7ddf9b':'var(--muted)';
      const sign=delta>0.005?'Overpaying by ':delta<-0.005?'Underpaying by ':'Even ';
      totalsWrap.append(mk('Difference',sign+fmtUSD(Math.abs(delta)),cls));
    }
  }
  const groupsWrap=$('cartGroups');groupsWrap.innerHTML='';
  if(total===0){
    const empty=document.createElement('p');empty.className='cart-empty';empty.textContent='Add cards using the search above.';groupsWrap.append(empty);
    return;
  }
  for(const owner of CART_OWNERS){
    const items=cartItems.filter(x=>x.owner===owner);
    if(!items.length)continue;
    const group=document.createElement('div');group.className='cart-group';
    const head=document.createElement('div');head.className='cart-group-head';
    const left=document.createElement('div');
    const title=document.createElement('strong');title.textContent=owner;
    const sub=document.createElement('div');sub.className='owner-sub';sub.textContent=`${items.length} item${items.length===1?'':'s'}`;
    left.append(title,sub);
    /* Owner summary flag */
    const haveBoth=items.filter(x=>x.shelf_price!=null&&x.online_price!=null);
    let flagText='',flagCls='';
    if(haveBoth.length){
      const delta=haveBoth.reduce((s,x)=>s+(Number(x.shelf_price)-Number(x.online_price)),0);
      if(Math.abs(delta)<0.005){flagText='Even';flagCls='even'}
      else if(delta>0){flagText='⚠ '+fmtUSD(delta)+' over';flagCls='over'}
      else {flagText='✓ '+fmtUSD(Math.abs(delta))+' under';flagCls='under'}
    }
    const flag=document.createElement('div');flag.className='owner-flag '+flagCls;flag.textContent=flagText;
    head.append(left,flag);
    const body=document.createElement('div');body.className='cart-group-body';
    head.onclick=()=>{body.classList.toggle('hidden')};
    for(const it of items){
      const row=document.createElement('div');row.className='cart-row';
      const img=document.createElement('img');img.src=it.image_url;img.alt='';img.loading='lazy';
      const meta=document.createElement('div');meta.className='meta';
      const nm=document.createElement('strong');nm.textContent=it.card_name;
      const sub2=document.createElement('small');sub2.textContent=[it.set_name,it.local_id?'#'+it.local_id:''].filter(Boolean).join(' · ')||it.card_id;
      meta.append(nm,sub2);
      /* Price box */
      const priceBox=document.createElement('div');priceBox.className='price-box';
      const lbl=document.createElement('label');lbl.textContent='Shelf $';
      const inp=document.createElement('input');inp.type='number';inp.step='0.01';inp.min='0';inp.placeholder='0.00';inp.value=it.shelf_price!=null?String(it.shelf_price):'';
      inp.onchange=async()=>{
        const raw=inp.value.trim();
        const val=raw===''?null:Number(raw);
        if(val!==null&&(isNaN(val)||val<0)){setStatus('cartStatus','Shelf price must be a non-negative number.');inp.value=it.shelf_price!=null?String(it.shelf_price):'';return}
        const {error}=await supabaseClient.from('family_shopping_cart').update({shelf_price:val}).eq('id',it.id).eq('family_id',signedInUser.id);
        if(error){setStatus('cartStatus','Could not save shelf price: '+error.message);return}
        it.shelf_price=val;
        renderCart();
      };
      const online=document.createElement('span');online.className='online';
      online.textContent=it.online_price!=null?'Online '+fmtUSD(Number(it.online_price)):'No online price';

  }
}

/* ---------- Adding cards ---------- */
function cardImageUrl(base,quality='high'){if(!base)return '';return /\/(high|low)\.(webp|png|jpg)$/i.test(base)?base:base.replace(/\/$/,'')+'/'+quality+'.webp'}
function sortBinderAlphabetically(b){
  const cards=[];
  for(const p of b.pages)for(const c of p.cards)if(c)cards.push(c);
  cards.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base'})||String(a.id||'').localeCompare(String(b.id||'')));
  const pagesNeeded=Math.max(1,Math.ceil(cards.length/9));
  while(b.pages.length<pagesNeeded){
    const next=Math.max(0,...b.pages.map(p=>p.pageNumber))+1;
    b.pages.push({pageNumber:next,cards:blankCards()});
  }
  for(const p of b.pages)p.cards=blankCards();
  let idx=0,lastPage=0,lastSlot=0;
  for(const p of b.pages){
    for(let i=0;i<9&&idx<cards.length;i++){
      p.cards[i]=cards[idx++];
      lastPage=p.pageNumber;lastSlot=i+1;
    }
  }
  return {page:lastPage,slot:lastSlot};
}
function deleteCardWithUndo(slotIndex){
  const b=currentBinder();if(!b)return;
  const pg=currentPage();if(!pg)return;
  const removed=pg.cards[slotIndex];if(!removed)return;
  const snapshot=b.pages.map(p=>({pageNumber:p.pageNumber,cards:p.cards.slice()}));
  lastDeleted={binderId:b.id,pageIndex:activePageIndex,pageNumber:pg.pageNumber,card:removed,snapshot};
  removeCardAndShift(slotIndex);
  renderBinder();
  saveBinderSoon();
  showUndoBar();
}
function showUndoBar(){
  let bar=document.getElementById('undoBar');
  if(!bar){
    bar=document.createElement('div');
    bar.id='undoBar';
    bar.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));z-index:20;background:#26364a;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px #000a';
    const msg=document.createElement('span');msg.id='undoMsg';msg.style.cssText='color:var(--text);font-size:.9rem;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    const btn=document.createElement('button');btn.type='button';btn.textContent='Undo';btn.style.cssText='background:var(--accent);color:#101722;border-color:var(--accent);font-weight:700;padding:6px 12px';
    btn.onclick=undoLastDelete;
    const close=document.createElement('button');close.type='button';close.textContent='×';close.setAttribute('aria-label','Dismiss');close.onclick=dismissUndo;close.style.padding='4px 9px';
    bar.append(msg,btn,close);
    document.body.append(bar);
  }
  document.getElementById('undoMsg').textContent='Removed '+lastDeleted.card.name;
  bar.style.display='flex';
  clearTimeout(showUndoBar._t);
  showUndoBar._t=setTimeout(dismissUndo,10000);
}
function dismissUndo(){
  lastDeleted=null;
  const bar=document.getElementById('undoBar');if(bar)bar.style.display='none';
}
function undoLastDelete(){
  if(!lastDeleted)return;
  const b=binders.find(x=>x.id===lastDeleted.binderId);
  if(!b){dismissUndo();return;}
  b.pages=lastDeleted.snapshot.map(p=>({pageNumber:p.pageNumber,cards:p.cards.slice()}));
  activeBinderId=b.id;
  activePageIndex=Math.min(lastDeleted.pageIndex,b.pages.length-1);
  dismissUndo();
  renderBinder();
  saveBinderSoon('Restored '+b.pages.length+' page'+(b.pages.length===1?'':'s')+'. Saving…');
}
function removeCardAndShift(slotIndex){
  const b=currentBinder();if(!b)return;
  const flat=[];
  for(const p of b.pages)for(const c of p.cards)flat.push(c);
  const currentPg=currentPage();
  const startGlobal=b.pages.indexOf(currentPg)*9+slotIndex;
  flat.splice(startGlobal,1);
  let idx=0;
  for(const p of b.pages){
    for(let i=0;i<9;i++)p.cards[i]=idx<flat.length?flat[idx++]:null;
  }
  while(b.pages.length>1&&b.pages[b.pages.length-1].cards.every(c=>!c))b.pages.pop();
  activePageIndex=Math.min(activePageIndex,b.pages.length-1);
}
function addToNextBlank(card){
  const b=currentBinder();if(!b)throw new Error('Open a binder first');
  let placed=false;
  for(const p of b.pages){if(p.cards.some(c=>!c)){p.cards[p.cards.findIndex(c=>!c)]=card;placed=true;break}}
  if(!placed){
    const next=Math.max(0,...b.pages.map(p=>p.pageNumber))+1;
    b.pages.push({pageNumber:next,cards:[card,...Array(8).fill(null)]});
  }
  return sortBinderAlphabetically(b);
}

$('importFile').onchange=async e=>{
  const file=e.target.files?.[0];e.target.value='';
  if(!file)return;
  if(!signedInUser){setStatus('libraryStatus','Please sign in first.');return}
  try{
    setStatus('libraryStatus','Reading backup file…');
    const text=await file.text();
    let payload;
    try{payload=JSON.parse(text)}catch{throw new Error('That file is not valid JSON.')}
    if(!payload||payload.format!=='pokemon-family-binder-backup-v3')throw new Error('Unrecognized backup file format.');
    if(!Array.isArray(payload.binders)||!payload.binders.length)throw new Error('Backup contains no binders.');
    const totalCards=payload.binders.reduce((n,b)=>n+(Array.isArray(b.pages)?b.pages.reduce((m,p)=>m+(Array.isArray(p.cards)?p.cards.filter(Boolean).length:0),0):0),0);
    let importedBinders=0,importedCards=0,importedCovers=0;
    for(const src of payload.binders){
      const baseName=(src.name||'Imported Binder').trim().slice(0,80)||'Imported Binder';
      const {data:newBinder,error:bErr}=await supabaseClient.from('family_binders').insert({family_id:signedInUser.id,name:baseName,cover_image:src.cover_image||null,is_default:false,sort_order:binders.length}).select('id,family_id,name,cover_image,is_default,sort_order,created_at').single();
      if(bErr)throw new Error('Could not create binder "'+baseName+'": '+bErr.message);
      const pages=Array.isArray(src.pages)&&src.pages.length?src.pages:[{pageNumber:1,cards:[]}];
      const pageNumbers=pages.map((p,i)=>normalizePageNumber(p.pageNumber||i+1));
      const uniquePages=Array.from(new Set(pageNumbers)).sort((a,b)=>a-b);
      const pageRows=uniquePages.map(n=>({family_id:signedInUser.id,binder_id:newBinder.id,page_number:n}));
      const {error:pErr}=await supabaseClient.from('family_binder_pages').insert(pageRows);
      if(pErr)throw new Error('Could not create pages for "'+baseName+'": '+pErr.message);
      const cardRows=[];
      for(let pi=0;pi<pages.length;pi++){
        const pageNumber=pageNumbers[pi];
        const cards=Array.isArray(pages[pi].cards)?pages[pi].cards:[];
        for(let si=0;si<9&&si<cards.length;si++){
          const c=cards[si];if(!c||!c.name||!c.image)continue;
          cardRows.push({family_id:signedInUser.id,binder_id:newBinder.id,page_number:pageNumber,slot_number:si+1,card_id:String(c.id||''),card_name:c.name,image_url:c.image,set_name:c.setName||null,local_id:c.localId||null});
        }
      }
      if(cardRows.length){
        const {error:cErr}=await supabaseClient.from('family_binder_cards').insert(cardRows);
        if(cErr)throw new Error('Could not import cards for "'+baseName+'": '+cErr.message);
      }
      binders.push({...newBinder,pages:uniquePages.map(pageNumber=>({pageNumber,cards:blankCards()}))});
      const justAdded=binders[binders.length-1];
      for(const r of cardRows){
        const pg=justAdded.pages.find(p=>p.pageNumber===r.page_number);
        if(pg&&r.slot_number>=1&&r.slot_number<=9)pg.cards[r.slot_number-1]={id:r.card_id,name:r.card_name,image:r.image_url,setName:r.set_name||'',localId:r.local_id||''};
      }
      importedBinders++;importedCards+=cardRows.length;if(src.cover_image)importedCovers++;
    }
    renderLibrary();renderCollection();
    refreshBackfillPanel();
  }catch(err){
    console.error(err);
    setStatus('libraryStatus','Import failed: '+(err.message||'unknown error'));
  }
};
